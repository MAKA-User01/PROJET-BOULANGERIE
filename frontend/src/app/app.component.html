<div class="toast-stack" aria-live="polite">
  <div class="toast" *ngFor="let item of toast.toasts" [class.toast--error]="item.tone === 'error'" [class.toast--info]="item.tone === 'info'" role="status">
    <span class="toast-icon"><svg [tmIcon]="item.tone === 'error' ? 'close' : item.tone === 'info' ? 'info' : 'check'"></svg></span>
    <div class="toast-body"><strong>{{ item.title }}</strong><span *ngIf="item.message">{{ item.message }}</span></div>
    <button type="button" class="toast-close" aria-label="Fermer la notification" (click)="toast.dismiss(item.id)"><svg tmIcon="close"></svg></button>
  </div>
</div>
